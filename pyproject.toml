[project]
name = "telegram-antigravity-bot"
version = "0.1.0"
description = "Telegram bot interface for Antigravity AI Agent CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.17.0",
    "aiohttp-socks>=0.12.0",
    "psutil>=5.9.8",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["A", "C", "E", "F", "B", "Q", "N", "S", "COM", "C4", "RET"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (imports aiogram ~5s). Skipped unless --run-slow is passed.",
]
